# CI gates for eshu-collector-prometheus-mimir.
#
# Stable job names (org contract; only ci-complete is ever required in a
# ruleset): changes, lanes (reusable lane bodies), ci-complete. The
# effective lane set inside `lanes` is lint, test, race, shell, boundary,
# govulncheck, gosec, actionlint — identical names to the retired inline
# lanes, so no required context churns.
#
# The image lane builds the shipped Dockerfile (no push) on every non-PR
# event and on PRs that touch image inputs, Go, or workflows (issue #11);
# an image-only PR runs that lane and nothing else. Publishing stays in
# image-publish.yml. The manifest's
# all-zero placeholder digest is dispositioned by TestPlaceholderImageGate,
# not by CI: the manifest is go:embed'ed into the binary, so a committed
# real digest would belong to an older build; the release workflow stamps
# the deployed digest when it lands.
#
# Lane bodies run from the pinned eshu-hq/.github reusable (issue #15):
# eshu-hq/.github/.github/workflows/go-collector-ci.yml@v2. v2 grows every
# input this repo waited on — path gates for govulncheck/gosec, package-mode
# govulncheck (Go 1.26 SSA-safe), a never-blocking gosec with findings in
# the artifact, and an actionlint lane. Pinned to the v2 merge commit the
# selftest callers proved green, never the tag.
#
# Accepted deltas of the move (documented, not silent):
# - gosec SARIF no longer uploads to the Security tab (reusable design: fork
#   PRs run on a read-only token); findings ride the 14-day artifact.
# - Per-scan scheduled filing (govulncheck/gosec issue steps) has no
#   reusable hook yet: scheduled findings still fail their lanes loud
#   (gosec-fail-on-findings on schedule), and triage rides the run page
#   until the reusable grows a filing hook (upstream follow-up).
# - The `git diff --check` step was vacuous (fresh checkouts have no
#   unstaged diff); gofumpt, tidy, and actionlint cover formatting.
# - The per-package coverage table is the reusable `go tool cover -func`
#   summary; the floor literal moves to the coverage-floor input, still
#   pinned equal to the Makefile by TestCoverageFloorParity.
#
# Pinned actions (SHAs re-resolved 2026-10-28 via git ls-remote; Dependabot
# github-actions proposes bumps, weekly grouped):
#   actions/checkout v7.0.1              3d3c42e5aac5ba805825da76410c181273ba90b1
#   dorny/paths-filter v4                ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
# Go tools (hash-verified by the toolchain on install; versions owned by the
# reusable, except gosec which this repo holds at v2.30.0 via its input):
#   golangci-lint v2.12.2 (config in .golangci.yml)
#   govulncheck v1.9.0, run with -scan package (Go 1.26 SSA-safe)
#   gosec v2.30.0, never blocking on PRs; scheduled runs with findings fail
#   red (this repo: 1 LOW G101 on the MetricRedactions metric-name constant
#   in telemetry.go, suppressed per-site with #nosec)

name: ci

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 06:00 UTC: every lane runs, like a push
  workflow_dispatch: # manual runs execute every lane, like a push

permissions:
  contents: read

# Cancel superseded runs per PR (or per ref for pushes and schedules).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Runs on every event on purpose: on push the filter outputs are unused
    # (lane conditions short-circuit on event), but every lane `needs` this
    # job — skipping it on push drags all lanes to skipped and the push run
    # goes vacantly green (observed on a sibling post-merge main run).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      fixtures: ${{ steps.filter.outputs.fixtures }}
      shell: ${{ steps.filter.outputs.shell }}
      image: ${{ steps.filter.outputs.image }}
      deps: ${{ steps.filter.outputs.deps }}
      workflows: ${{ steps.filter.outputs.workflows }}
      misc: ${{ steps.filter.outputs.misc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          # Needed so the `misc` catch-all below can use `!` negations;
          # groups without negations behave exactly as before.
          predicate-quantifier: 'some-with-excludes'
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
            fixtures:
              # Every entry is grep-proven test- or embed-consumed:
              # testdata/** via parity_test.go:323
              # (os.ReadFile testdata/8864-parity-prometheus-mimir.json),
              # **/*.json via manifest_grant_test.go:125
              # (os.ReadFile grant.example.json),
              # manifest.yaml via manifest_embed.go:10
              # (go:embed manifest.yaml) plus manifest_grant_test.go:50
              # (os.ReadFile manifest.yaml),
              # grant.example.json via manifest_grant_test.go:125.
              # config.example.yaml is NOT here: no test reads it
              # (rg for config.example under Go files finds nothing), so a
              # change to it falls through to misc and runs the full Go
              # lanes, fail closed.
              - 'testdata/**'
              - '**/testdata/**'
              - '**/*.json'
              - 'manifest.yaml'
              - 'grant.example.json'
            shell:
              - '**/*.sh'
            image:
              - 'Dockerfile'
              - '.dockerignore'
            deps:
              - 'go.mod'
              - 'go.sum'
            workflows:
              - '.github/workflows/**'
            misc:
              # Default required by the epic: anything not classified above
              # runs the full Go lanes. Docs-only must keep skipping, so the
              # docs skip set stays negated here; every classified pattern is
              # negated too so narrow lanes (fixtures/shell) keep their
              # shape. Proven by the docs-only / fixture-only skip proofs.
              - '**'
              - '!**/*.md'
              - '!LICENSE'
              - '!CODEOWNERS'
              - '!**/*.go'
              - '!go.mod'
              - '!go.sum'
              - '!.golangci.yml'
              - '!testdata/**'
              - '!**/testdata/**'
              - '!**/*.json'
              - '!manifest.yaml'
              - '!grant.example.json'
              - '!**/*.sh'
              - '!Dockerfile'
              - '!.dockerignore'
              - '!.github/workflows/**'

  lanes:
    name: lanes
    needs: [changes]
    # No timeout-minutes: the schema forbids it on reusable-call jobs. Each
    # inner lane carries its own timeout, which bounds this job.
    uses: eshu-hq/.github/.github/workflows/go-collector-ci.yml@4d01ab90baf5dd77c21cc1ee6bdf701332613449 # v2
    with:
      module: prometheus-mimir
      go-version-file: go.mod
      coverage-floor: 94.7
      # Pin every tool the retired lanes pinned. Reusable defaults float
      # across tags, and this move must neither downgrade nor silently
      # upgrade a scanner. (gosec stays at v2.30.0, newer than the default;
      # shellcheck has no version input: the reusable pins its action by
      # SHA, which the v2 pin freezes.)
      golangci-lint-version: v2.12.2
      govulncheck-version: v1.9.0
      gosec-version: v2.30.0
      actionlint-version: 1.7.12
      actionlint-sha256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      run-lint: ${{ github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflows == 'true' }}
      # No shell trip here: no test executes a script in this repo, so a
      # script-only PR runs shellcheck alone (workflow changes still run it
      # via the reusable actionlint lane, not here).
      run-test: ${{ github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.fixtures == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflows == 'true' }}
      run-race: ${{ github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflows == 'true' }}
      run-shell: ${{ github.event_name != 'pull_request' || needs.changes.outputs.shell == 'true' }}
      # Build-only proof of the shipped Dockerfile (issue #11). Push-side
      # publishing lives in image-publish.yml.
      run-image: ${{ github.event_name != 'pull_request' || needs.changes.outputs.image == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.workflows == 'true' }}
      image-tag: eshu-collector-prometheus-mimir:ci
      image-context: .
      image-command: |
        set -euo pipefail
        user=$(docker image inspect --format '{{.Config.User}}' eshu-collector-prometheus-mimir:ci)
        echo "image user: $user"
        [ "$user" = "65532:65532" ]
        from_total=$(grep -Ec '^[[:space:]]*FROM ' Dockerfile)
        from_pinned=$(grep -Ec '^[[:space:]]*FROM [^[:space:]]+@sha256:[0-9a-f]{64}' Dockerfile)
        echo "Dockerfile bases: $from_pinned/$from_total digest-pinned"
        [ "$from_pinned" -eq "$from_total" ]
      run-boundary: ${{ github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflows == 'true' }}
      boundary-command: go test -count=1 -run TestImportBoundaryRejectsCoreAndCrossCollectorImports .
      # A Go-only change can newly reach a vulnerable symbol in an already
      # present dependency, so Go PRs scan too.
      run-govulncheck: ${{ github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.workflows == 'true' }}
      run-gosec: ${{ github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.workflows == 'true' }}
      # Findings fail scheduled runs so triage stays loud; PR runs stay
      # advisory green.
      gosec-fail-on-findings: ${{ github.event_name == 'schedule' }}
      run-actionlint: ${{ github.event_name != 'pull_request' || needs.changes.outputs.workflows == 'true' }}

  ci-complete:
    needs: [changes, lanes]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: aggregate (pass when needed lanes passed or legitimately skipped)
        run: |
          python3 - <<'EOF'
          import json, os
          # NEEDS_JSON is toJSON(needs): {job: {"result": ..., "outputs": ...}}.
          # Compare v["result"]: comparing whole job objects never matches
          # (false-green), and needs.*.result is a bare ARRAY that kills
          # green runs. Proven by the seeded red/green lane proofs in the
          # closing PR; never change this shape without re-seeding.
          needs = json.loads(os.environ["NEEDS_JSON"])
          bad = {k: v.get("result") for k, v in needs.items()
                 if isinstance(v, dict) and v.get("result") in ("failure", "cancelled")}
          if bad:
              print("FAIL:", bad)
              raise SystemExit(1)
          print("ci-complete: pass (skips allowed)")
          EOF
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
