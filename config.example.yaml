# Example component activation config for the Prometheus-Mimir collector.
# Copy it, replace the placeholder host and scope, and point the environment
# variables at real credentials. It holds no secrets: token_env and
# tenant_id_env NAME environment variables the worker process exports; their
# values never appear here, in facts, in logs, or in statuses.
#
# Cutover identity. When this activation replaces the in-tree
# collector-prometheus-mimir, these values must equal the in-tree ones, or
# every stable fact key changes:
#   targets[].scope_id   = the in-tree target's scope_id
#   targets[].instance_id = the in-tree target's instance_id
#   host.sourceSystem     = the in-tree source system (prometheus_mimir)
host:
  sourceSystem: prometheus_mimir
  scope:
    id: prometheus:parity:prod
    kind: metric_source
process:
  command: ./collector
  args:
    - --sdk-stdio
  stdout_limit_bytes: 67108864
config:
  targets:
    - provider: prometheus
      scope_id: prometheus:parity:prod
      instance_id: prometheus-parity
      base_url: https://prometheus.example.test
      path_prefix: ""
      # token_env names the env var holding the Bearer token. Omit for
      # credential-free targets; never inline a token here.
      # token_env: PROMETHEUS_TOKEN
      resource_limit: 100
      stale_after: 1h
      enabled: true
      declared_ids:
        - parity.rules:ParityBurn
      observed_only_hint: true
    - provider: mimir
      scope_id: mimir:parity:tenant
      instance_id: mimir-parity
      base_url: https://mimir.example.test
      tenant_id_env: MIMIR_TENANT_ID
      resource_limit: 100
      enabled: true
